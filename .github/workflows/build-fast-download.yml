name: Build Fast Download APK

on:
  push:
    branches: ["fast-download-build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Reassemble source archive
        run: |
          cat FastDownload-source.tgz.part0 FastDownload-source.tgz.part1 FastDownload-source.tgz.part2 FastDownload-source.tgz.part3 FastDownload-source.tgz.part4 > FastDownload-source.tgz
          mkdir -p FastDownload
          tar -xzf FastDownload-source.tgz -C FastDownload
      - name: Build debug APK
        run: gradle --no-daemon -p FastDownload assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-debug-apk
          path: FastDownload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
