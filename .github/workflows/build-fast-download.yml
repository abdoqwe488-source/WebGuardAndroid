name: Build Fast Download APK

on:
  push:
    branches: ["fast-download-build"]
    paths:
      - ".github/workflows/build-fast-download.yml"
      - "FastDownload-v1.1.3-source-project.zip.b64"
  workflow_dispatch:

concurrency:
  group: fast-download-apk-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore Fast Download source project
        shell: bash
        run: |
          mkdir -p FastDownload
          base64 --decode FastDownload-v1.1.3-source-project.zip.b64 > /tmp/FastDownload-source-project.zip
          unzip -q /tmp/FastDownload-source-project.zip -d FastDownload
          test -f FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt
          grep -q "versionName '1.1.3'" FastDownload/app/build.gradle
          grep -q 'verifyMediaFile(result, requireVideo = !audio)' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt

      - name: Replace FFprobe-based validation with Android MediaExtractor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt")
          s = p.read_text()
          call = "verifyMediaFile(result, requireVideo = !audio)"
          if s.count(call) != 1:
              raise SystemExit(f"Expected one output-verification call, found {s.count(call)}")
          s = s.replace(call, "verifyMediaFileWithMediaExtractor(result, requireVideo = !audio)", 1)

          method = '''
              // Validate the saved file with Android's own media parser.
              // This avoids launching the bundled FFprobe executable and its
              // missing transitive Termux/Expat dependency on some devices.
              private fun verifyMediaFileWithMediaExtractor(file: java.io.File, requireVideo: Boolean) {
                  if (!file.isFile || file.length() <= 0L) {
                      throw IllegalStateException("الملف الناتج غير موجود أو فارغ.")
                  }
                  val extractor = android.media.MediaExtractor()
                  try {
                      extractor.setDataSource(file.absolutePath)
                      var hasVideo = false
                      var hasAudio = false
                      for (index in 0 until extractor.trackCount) {
                          val mime = extractor.getTrackFormat(index)
                              .getString(android.media.MediaFormat.KEY_MIME)
                              .orEmpty()
                          if (mime.startsWith("video/")) hasVideo = true
                          if (mime.startsWith("audio/")) hasAudio = true
                      }
                      if (requireVideo && !hasVideo) {
                          throw IllegalStateException("الفيديو الناتج لا يحتوي على مسار صورة.")
                      }
                      if (!requireVideo && !hasAudio) {
                          throw IllegalStateException("الملف الصوتي الناتج لا يحتوي على مسار صوت.")
                      }
                  } catch (e: Exception) {
                      if (e is IllegalStateException &&
                          (e.message?.contains("لا يحتوي على مسار") == true)) throw e
                      throw IllegalStateException("تعذر قراءة مسارات الوسائط في الملف الناتج: ${e.message}", e)
                  } finally {
                      extractor.release()
                  }
              }
          '''
          # Insert immediately before the last class-closing brace.
          close = s.rfind("}")
          if close < 0:
              raise SystemExit("Could not find MainActivity class closing brace.")
          s = s[:close] + method + "\n" + s[close:]

          # Increment the app version to install as an update over 1.1.3.
          p.write_text(s)
          g = Path("FastDownload/app/build.gradle")
          gradle = g.read_text()
          gradle = gradle.replace("versionCode 5", "versionCode 6", 1)
          gradle = gradle.replace("versionName '1.1.3'", "versionName '1.1.4'", 1)
          if "versionCode 6" not in gradle or "versionName '1.1.4'" not in gradle:
              raise SystemExit("Could not bump version to 1.1.4.")
          g.write_text(gradle)
          PY
          grep -q 'verifyMediaFileWithMediaExtractor(result, requireVideo = !audio)' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt
          grep -q 'MediaExtractor' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon -p FastDownload assembleDebug

      - name: Validate APK structure and supported ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="FastDownload/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" > /tmp/apk-zip-check.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libffprobe.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libffprobe.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libffmpeg.zip.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libffmpeg.zip.so'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.fastdownload.app' versionCode='6' versionName='1.1.4'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'24'"
          ls -lh "$APK"

      - name: Verify APK signature and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="FastDownload/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee FastDownload/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-1.1.4-debug-apk-arm
          path: |
            FastDownload/app/build/outputs/apk/debug/app-debug.apk
            FastDownload/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact source project
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-1.1.4-source-project
          path: FastDownload/
          retention-days: 14
