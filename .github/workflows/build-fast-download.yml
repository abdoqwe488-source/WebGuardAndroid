name: Build Fast Download APK

on:
  push:
    branches: ["fast-download-build"]
    paths:
      - ".github/workflows/build-fast-download.yml"
      - "FastDownload-v1.1.1-source.tar.xz.b64.part*"
  workflow_dispatch:

concurrency:
  group: fast-download-apk-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Reassemble updated source archive
        shell: bash
        run: |
          cat FastDownload-v1.1.1-source.tar.xz.b64.part0 FastDownload-v1.1.1-source.tar.xz.b64.part1 FastDownload-v1.1.1-source.tar.xz.b64.part2 FastDownload-v1.1.1-source.tar.xz.b64.part3 FastDownload-v1.1.1-source.tar.xz.b64.part4 FastDownload-v1.1.1-source.tar.xz.b64.part5 FastDownload-v1.1.1-source.tar.xz.b64.part6 > FastDownload-v1.1.1-source.tar.xz.b64
          base64 --decode FastDownload-v1.1.1-source.tar.xz.b64 > FastDownload-v1.1.1-source.tar.xz
          tar -xJf FastDownload-v1.1.1-source.tar.xz -C .
          test -f FastDownload/app/build.gradle
      - name: Apply Android compatibility, size, and metadata fixes
        shell: bash
        run: |
          sed -i 's/TextInputLayout\.LayoutParams/LinearLayout.LayoutParams/g' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters 'armeabi-v7a', 'arm64-v8a'/" FastDownload/app/build.gradle
          sed -i "s/versionCode 2/versionCode 3/; s/versionName '1.1.0'/versionName '1.1.1'/" FastDownload/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt")
          s = p.read_text()
          s = s.replace(
              'FormatOption(id, "صوت ${rate.coerceAtLeast(0)} kbps • ${format.ext ?: "audio"}", size, approx, true, true)',
              '// The selected source audio is transcoded to MP3, so final size is only an estimate.\n                    FormatOption(id, "صوت ${rate.coerceAtLeast(0)} kbps • ${format.ext ?: "audio"}", size, true, true, true)'
          )
          s = s.replace(
              'FormatOption(id, label, combined.first, combined.second, hasAudio, false)',
              '// Non-MP4 sources are recoded to MP4; their final size may differ from the source stream.\n                FormatOption(id, label, combined.first, combined.second || !format.ext.equals("mp4", ignoreCase = true), hasAudio, false)'
          )
          old = '''        if (result.length() <= 0L) throw IllegalStateException("الملف الناتج فارغ.")
                  withContext(Dispatchers.IO) {
                      saveToDownloads(result, targetName, replace)
                  }
                  result.delete()
                  return true
          '''
          new = '''        val finalSizeBytes = result.length()
                  if (finalSizeBytes <= 0L) throw IllegalStateException("الملف الناتج فارغ.")
                  withContext(Dispatchers.IO) {
                      saveToDownloads(result, targetName, replace)
                  }
                  result.delete()
                  if (queueTotal == 1) {
                      withContext(Dispatchers.Main) {
                          Toast.makeText(this@MainActivity, "الحجم الفعلي للملف: ${formatBytes(finalSizeBytes)}", Toast.LENGTH_LONG).show()
                      }
                  }
                  return true
          '''
          if old in s:
              s = s.replace(old, new)
          elif "الحجم الفعلي للملف:" not in s:
              raise SystemExit("Could not apply actual output-size patch; refusing to build.")
          s = s.replace('            addOption("--no-cache-dir")\n', '')
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle --no-daemon -p FastDownload assembleDebug
      - name: Verify APK signature
        shell: bash
        run: |
          APK="FastDownload/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-1.1.1-debug-apk-arm
          path: FastDownload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
