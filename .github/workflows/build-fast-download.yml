name: Build Fast Download APK

on:
  push:
    branches: ["fast-download-build"]
    paths:
      - ".github/workflows/build-fast-download.yml"
      - "FastDownload-v1.1.1-source.tar.xz.b64.part*"
  workflow_dispatch:

concurrency:
  group: fast-download-apk-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Reassemble updated source archive
        shell: bash
        run: |
          cat FastDownload-v1.1.1-source.tar.xz.b64.part0 FastDownload-v1.1.1-source.tar.xz.b64.part1 FastDownload-v1.1.1-source.tar.xz.b64.part2 FastDownload-v1.1.1-source.tar.xz.b64.part3 FastDownload-v1.1.1-source.tar.xz.b64.part4 FastDownload-v1.1.1-source.tar.xz.b64.part5 FastDownload-v1.1.1-source.tar.xz.b64.part6 > FastDownload-v1.1.1-source.tar.xz.b64
          base64 --decode FastDownload-v1.1.1-source.tar.xz.b64 > FastDownload-v1.1.1-source.tar.xz
          tar -xJf FastDownload-v1.1.1-source.tar.xz -C .
          test -f FastDownload/app/build.gradle
      - name: Apply Android compatibility, size, and metadata fixes
        shell: bash
        run: |
          sed -i 's/TextInputLayout\.LayoutParams/LinearLayout.LayoutParams/g' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters 'armeabi-v7a', 'arm64-v8a'/" FastDownload/app/build.gradle
          sed -i "s/versionCode 2/versionCode 4/; s/versionName '1.1.0'/versionName '1.1.2'/" FastDownload/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt")
          s = p.read_text()
          old_audio = 'FormatOption(id, "صوت ${rate.coerceAtLeast(0)} kbps • ${format.ext ?: "audio"}", size, approx, true, true)'
          new_audio = '// The source audio is transcoded to MP3; final size is approximate.\n                    FormatOption(id, "صوت ${rate.coerceAtLeast(0)} kbps • ${format.ext ?: "audio"}", size, true, true, true)'
          if old_audio in s:
              s = s.replace(old_audio, new_audio, 1)
          old_video = 'FormatOption(id, label, combined.first, combined.second, hasAudio, false)'
          new_video = '// Non-MP4 sources are recoded to MP4; final size may differ.\n                FormatOption(id, label, combined.first, combined.second || !format.ext.equals("mp4", ignoreCase = true), hasAudio, false)'
          if old_video in s:
              s = s.replace(old_video, new_video, 1)
          needle = '        if (result.length() <= 0L) throw IllegalStateException("الملف الناتج فارغ.")'
          replacement = '        val finalSizeBytes = result.length()\n        if (finalSizeBytes <= 0L) throw IllegalStateException("الملف الناتج فارغ.")'
          if needle in s:
              s = s.replace(needle, replacement, 1)
          if '        val finalSizeBytes = result.length()' not in s:
              raise SystemExit("Actual-size calculation patch did not apply.")
          needle2 = '        result.delete()\n        return true'
          replacement2 = '        result.delete()\n        if (queueTotal == 1) {\n            withContext(Dispatchers.Main) {\n                Toast.makeText(this@MainActivity, "الحجم الفعلي للملف: ${formatBytes(finalSizeBytes)}", Toast.LENGTH_LONG).show()\n            }\n        }\n        return true'
          if needle2 in s:
              s = s.replace(needle2, replacement2, 1)
          if 'الحجم الفعلي للملف:' not in s:
              raise SystemExit("Actual-size message patch did not apply.")
          s = s.replace('            addOption("--no-cache-dir")\n', '')
          p.write_text(s)
          PY
      - name: Fix video format selection and reject audio-only output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt")
          s = p.read_text()

          old_selector = "\n".join([
              '                val selector = if (format == null || format.id == "best") {',
              '                    "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best[ext=mp4]/best"',
              '                } else if (format.hasAudio) {',
              '                    "${format.id}/best[ext=mp4]/best"',
              '                } else {',
              '                    "${format.id}+bestaudio[ext=m4a]/${format.id}+bestaudio"',
              '                }'
          ])
          new_selector = "\n".join([
              '                // Video mode must never fall back to an audio-only format.',
              '                val selector = if (format == null || format.id == "best") {',
              '                    "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best[ext=mp4][vcodec!=none]/best[vcodec!=none]"',
              '                } else if (format.hasAudio) {',
              '                    "${format.id}"',
              '                } else {',
              '                    // Keep the selected video even when a separate audio stream is unavailable.',
              '                    "${format.id}+bestaudio/${format.id}"',
              '                }'
          ])
          if old_selector not in s:
              raise SystemExit("Video format selector patch did not match the source.")
          s = s.replace(old_selector, new_selector, 1)

          block_start = s.find('        val expectedExtension = if (audio) "mp3" else "mp4"')
          if block_start < 0:
              raise SystemExit("Could not find result selection block.")
          block_end = s.find('        withContext(Dispatchers.IO) {', block_start)
          if block_end < 0:
              raise SystemExit("Could not find save-to-downloads block.")
          new_result_block = "\n".join([
              '        val expectedExtension = if (audio) "mp3" else "mp4"',
              '        val candidates = tempDir.listFiles()',
              '            ?.filter { it.isFile && it.lastModified() >= downloadStartedAt &&',
              '                !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") && it.length() > 0L }',
              '            .orEmpty()',
              '        // Never rename an audio-only file to MP4.',
              '        val result = candidates.filter { it.extension.equals(expectedExtension, ignoreCase = true) }',
              '            .maxByOrNull { it.lastModified() }',
              '            ?: throw IllegalStateException(if (audio)',
              '                "تعذر إنشاء ملف MP3 بعد التحويل."',
              '            else "لم يتم إنشاء فيديو MP4 يحتوي على الصورة والصوت. جرّب جودة فيديو أخرى.")',
              '        val finalSizeBytes = result.length()',
              '        if (finalSizeBytes <= 0L) throw IllegalStateException("الملف الناتج فارغ.")'
          ])
          s = s[:block_start] + new_result_block + "\n" + s[block_end:]
          p.write_text(s)
          PY
      - name: Upload patched source project
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-1.1.2-source-project
          path: FastDownload/
          retention-days: 7
      - name: Build debug APK
        run: gradle --no-daemon -p FastDownload assembleDebug
      - name: Verify APK signature
        shell: bash
        run: |
          APK="FastDownload/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-1.1.2-debug-apk-arm
          path: FastDownload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
