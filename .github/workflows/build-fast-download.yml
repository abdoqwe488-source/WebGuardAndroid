name: Build Fast Download APK

on:
  push:
    branches: ["fast-download-build"]
    paths:
      - ".github/workflows/build-fast-download.yml"
      - "FastDownload-v1.1.3-source-project.zip.b64"
  workflow_dispatch:

concurrency:
  group: fast-download-apk-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore Fast Download 1.1.3 source project
        shell: bash
        run: |
          mkdir -p FastDownload
          base64 --decode FastDownload-v1.1.3-source-project.zip.b64 > /tmp/FastDownload-1.1.3-source-project.zip
          unzip -q /tmp/FastDownload-1.1.3-source-project.zip -d FastDownload
          test -f FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt
          grep -q "versionName '1.1.3'" FastDownload/app/build.gradle
          grep -q 'execute(request, jobId, true)' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt
          grep -q 'verifyMediaFile(result, requireVideo = !audio)' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt
          grep -q 'private fun isFacebookUrl' FastDownload/app/src/main/java/com/fastdownload/app/MainActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon -p FastDownload assembleDebug

      - name: Validate APK structure and supported ABIs
        shell: bash
        run: |
          APK="FastDownload/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" > /tmp/apk-zip-check.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libffprobe.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libffprobe.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libffmpeg.zip.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libffmpeg.zip.so'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.fastdownload.app' versionCode='5' versionName='1.1.3'|sdkVersion:'24'"
          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="FastDownload/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee FastDownload/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-1.1.3-debug-apk-arm
          path: |
            FastDownload/app/build/outputs/apk/debug/app-debug.apk
            FastDownload/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact source project
        uses: actions/upload-artifact@v4
        with:
          name: FastDownload-1.1.3-source-project
          path: FastDownload/
          retention-days: 14
